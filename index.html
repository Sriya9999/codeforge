<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Grading Console</title>
<meta name="description" content="A prototype grading console: import marks, review data quality, configure grade ranges and export grades safely. Not an official BITS Pilani system.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='4' fill='%23F6F4EE'/%3E%3Cpath d='M7 25V8h4v17z' fill='%231D3F94'/%3E%3Cpath d='M14 25V13h4v12z' fill='%23B3202D'/%3E%3Cpath d='M21 25v-7h4v7z' fill='%23E8A916'/%3E%3Cpath d='M5 25.5h22' stroke='%231D3F94' stroke-width='1.5'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Source+Serif+4:opsz,wght@8..60,400;8..60,600&display=swap">
<link rel="stylesheet" href="src/styles.css">
</head>
<body>
<a class="skip" href="#main">Skip to content</a>

<header class="masthead">
  <div class="wrap masthead__inner">
    <div class="brand">
      <span class="brand__mark" aria-hidden="true"></span>
      <span class="brand__name">Grading Console</span>
      <span class="brand__tag">Prototype</span>
    </div>
    <div class="masthead__file" id="fileChip" hidden></div>
  </div>
</header>

<nav class="steps" aria-label="Grading workflow">
  <ol class="wrap steps__list" id="steps"></ol>
</nav>

<div class="wrap layout" id="layout">
  <aside class="rail" id="rail" aria-label="Courses" hidden></aside>
  <main id="main" class="stage" tabindex="-1"></main>
</div>

<footer class="footer">
  <div class="wrap">
    A prototype built for a design and debugging exercise. It is <strong>not</strong> an official
    BITS Pilani grading system. Files are processed entirely in your browser and never uploaded.
  </div>
</footer>

<div class="toast" id="toast" role="status" aria-live="polite" hidden></div>

<script src="vendor/xlsx.full.min.js"></script>
<script src="src/core.js"></script>
<script src="src/app.js"></script>
</body>
</html>
